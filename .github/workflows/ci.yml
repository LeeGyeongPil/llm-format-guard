# No key and no model needed: everything runs on the standard library and the practice mock model.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches breakage from new Python releases
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run pytest -q
      - run: uv run python examples/quickstart.py
      - run: uv run llm-format-guard eval examples/data/conversations.jsonl --mock
